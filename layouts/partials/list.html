{{ range . }}
  <div class="list-item">
    <div>
      {{- range .links -}}
      {{ if .url }}
        <a href="{{ .url | relURL }}"
           target="_blank" rel="noopener noreferrer">{{ .label }}
        </a>
      {{ else }}
        <span>{{ .label }}</span>
      {{ end }}
      {{- end -}}
    </div>
    <span>{{ .date }}</span>
  </div>
{{ end }}
