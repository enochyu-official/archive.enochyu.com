baseURL = 'https://archive.enochyu.com/'
title = 'Enoch Yu - Archive'
defaultContentLanguage = 'en'

enableRobotsTXT = true

[params]
  author = "Enoch Yu"
  favicon = "/favicon/favicon.ico"
  [params.social]
    website = "https://enochyu.com/"
    youtube = "https://www.youtube.com/channel/UCCnkn0YRKStraznc7kuICRg"
    blog = "https://blog.enochyu.com/"
    github = "https://github.com/enochyu-official"

[taxonomies]
  category = "categories"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    timeZone = 'America/New_York'
    title = 'Enoch Yu'
    weight = 1
    [languages.en.pagination]
      path = 'page'

[security]
allowContent = ['^text/html$', '^text/markdown$']

